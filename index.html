<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>腕神経叢 解剖学5択クイズ</title>
  <style>
    :root {
      --primary-color: #2b6cb0;
      --primary-hover: #2c5282;
      --success-color: #38a169;
      --error-color: #e53e3e;
      --bg-color: #f7fafc;
      --card-bg: #ffffff;
      --text-color: #2d3748;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 650px;
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      padding: 24px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 2px solid #edf2f7;
    }

    .title {
      font-size: 1.25rem;
      font-weight: bold;
      color: var(--primary-color);
    }

    .progress {
      font-size: 0.9rem;
      color: #718096;
      font-weight: bold;
    }

    .loading, .error-message {
      text-align: center;
      padding: 40px 0;
      font-weight: bold;
      color: var(--primary-color);
    }

    .error-message {
      color: var(--error-color);
    }

    /* モード選択画面 */
    .mode-selection {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 10px;
    }

    .mode-btn {
      width: 100%;
      padding: 16px;
      font-size: 1.05rem;
      font-weight: bold;
      color: #2b6cb0;
      background-color: #ebf8ff;
      border: 2px solid #bee3f8;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }

    .mode-btn:hover {
      background-color: var(--primary-color);
      color: white;
      border-color: var(--primary-color);
    }

    .mode-btn.random-mode {
      background-color: #feebc8;
      color: #c05621;
      border-color: #fbd38d;
    }

    .mode-btn.random-mode:hover {
      background-color: #dd6b20;
      color: white;
      border-color: #dd6b20;
    }

    .category-badge {
      display: inline-block;
      background-color: #ebf8ff;
      color: #2b6cb0;
      font-size: 0.8rem;
      font-weight: bold;
      padding: 4px 10px;
      border-radius: 12px;
      margin-bottom: 12px;
    }

    .question-text {
      font-size: 1.1rem;
      font-weight: bold;
      line-height: 1.6;
      margin-bottom: 16px;
    }

    .image-container {
      text-align: center;
      margin-bottom: 20px;
    }

    .question-image {
      max-width: 100%;
      max-height: 320px;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
      object-fit: contain;
    }

    .choices-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }

    .choice-btn {
      width: 100%;
      text-align: left;
      padding: 14px 18px;
      font-size: 1rem;
      background-color: #fff;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
    }

    .choice-btn:hover:not(:disabled) {
      border-color: var(--primary-color);
      background-color: #ebf8ff;
    }

    .choice-number {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background-color: #edf2f7;
      color: #4a5568;
      font-weight: bold;
      font-size: 0.85rem;
      margin-right: 12px;
      flex-shrink: 0;
    }

    .choice-btn.correct {
      background-color: #c6f6d5 !important;
      border-color: var(--success-color) !important;
      color: #22543d;
      font-weight: bold;
    }

    .choice-btn.correct .choice-number {
      background-color: var(--success-color);
      color: white;
    }

    .choice-btn.incorrect {
      background-color: #fed7d7 !important;
      border-color: var(--error-color) !important;
      color: #742a2a;
    }

    .choice-btn.incorrect .choice-number {
      background-color: var(--error-color);
      color: white;
    }

    .explanation-card {
      background-color: #f7fafc;
      border-left: 4px solid var(--primary-color);
      padding: 16px;
      border-radius: 4px;
      margin-bottom: 20px;
      display: none;
    }

    .explanation-title {
      font-size: 0.95rem;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .explanation-title.is-correct { color: var(--success-color); }
    .explanation-title.is-incorrect { color: var(--error-color); }

    .explanation-text {
      font-size: 0.95rem;
      line-height: 1.5;
      color: #4a5568;
    }

    .next-btn, .top-btn {
      width: 100%;
      padding: 14px;
      font-size: 1rem;
      font-weight: bold;
      color: white;
      background-color: var(--primary-color);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .next-btn:hover, .top-btn:hover {
      background-color: var(--primary-hover);
    }

    .top-btn-outline {
      background-color: transparent;
      color: var(--primary-color);
      border: 2px solid var(--primary-color);
      margin-top: 10px;
    }

    .top-btn-outline:hover {
      background-color: #ebf8ff;
    }

    .result-box {
      text-align: center;
      padding: 20px 0;
    }

    .result-score {
      font-size: 2.5rem;
      font-weight: bold;
      color: var(--primary-color);
      margin: 16px 0;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <div class="title">腕神経叢 5択クイズ</div>
      <div class="progress" id="progress-text">---</div>
    </div>

    <!-- ローディング表示 -->
    <div id="loading-view" class="loading">
      問題データを読み込み中...
    </div>

    <!-- モード選択画面 -->
    <div id="mode-view" style="display: none;">
      <h3 style="margin-bottom: 16px; text-align: center; color: #4a5568;">学習モードを選択してください</h3>
      <div class="mode-selection">
        <button class="mode-btn" onclick="startMode('外側グループ')">外側グループの問題</button>
        <button class="mode-btn" onclick="startMode('後ろ側グループ')">後ろ側グループの問題</button>
        <button class="mode-btn" onclick="startMode('内側グループ')">内側グループの問題</button>
        <button class="mode-btn" onclick="startMode('過去問')">過去問</button>
        <button class="mode-btn random-mode" onclick="startMode('総合ランダム')">🎲 総合ランダム問題（全範囲）</button>
      </div>
    </div>

    <!-- クイズ解答画面 -->
    <div id="quiz-view" style="display: none;">
      <div id="category-badge" class="category-badge">カテゴリ</div>
      <div id="question-text" class="question-text"></div>
      
      <div id="image-container" class="image-container" style="display: none;">
        <img id="question-image" class="question-image" src="" alt="問題画像">
      </div>

      <div id="choices-container" class="choices-container"></div>

      <div id="explanation-card" class="explanation-card">
        <div id="explanation-title" class="explanation-title"></div>
        <div id="explanation-text" class="explanation-text"></div>
      </div>

      <button id="next-btn" class="next-btn" style="display: none;" onclick="nextQuestion()">次の問題へ</button>
    </div>

    <!-- 結果画面 -->
    <div id="result-view" class="result-box" style="display: none;">
      <h2>全問終了！</h2>
      <div class="result-score" id="result-score">0 / 0</div>
      <p id="result-comment" style="margin-bottom: 20px; color: #718096;"></p>
      <button class="top-btn" onclick="showModeSelection()">モード選択に戻る</button>
    </div>
  </div>

  <script>
    // ★ご自身のGASデプロイURLを設定してください
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzz04O2U7j0K3EaO1e2_Example/exec";

    let allQuestions = [];
    let currentQuestions = [];
    let currentIndex = 0;
    let score = 0;
    let isAnswered = false;

    // データ全件取得
    async function fetchQuestions() {
      try {
        const response = await fetch(GAS_WEB_APP_URL);
        if (!response.ok) throw new Error("通信エラーが発生しました");
        allQuestions = await response.json();
        
        if (!allQuestions || allQuestions.length === 0) {
          throw new Error("取得できた問題データがありません");
        }

        document.getElementById("loading-view").style.display = "none";
        showModeSelection();
      } catch (err) {
        console.error("Fetch Error:", err);
        const loadingElem = document.getElementById("loading-view");
        loadingElem.className = "error-message";
        loadingElem.innerHTML = "問題データの読み込みに失敗しました。<br>GASのURLとスプレッドシートをご確認ください。";
      }
    }

    // モード選択画面の表示
    function showModeSelection() {
      document.getElementById("quiz-view").style.display = "none";
      document.getElementById("result-view").style.display = "none";
      document.getElementById("mode-view").style.display = "block";
      document.getElementById("progress-text").textContent = "モード選択";
    }

    // クイズの開始（指定モードの抽出）
    function startMode(selectedMode) {
      if (selectedMode === '総合ランダム') {
        // 全問題をシャッフル
        currentQuestions = [...allQuestions].sort(() => Math.random() - 0.5);
      } else {
        // カテゴリ名でフィルタリング
        currentQuestions = allQuestions.filter(q => q.category && q.category.trim() === selectedMode);
      }

      if (currentQuestions.length === 0) {
        alert(`「${selectedMode}」に該当する問題が見つかりませんでした。\nスプレッドシートのA列(category)をご確認ください。`);
        return;
      }

      currentIndex = 0;
      score = 0;
      document.getElementById("mode-view").style.display = "none";
      document.getElementById("quiz-view").style.display = "block";
      showQuestion();
    }

    // 問題表示
    function showQuestion() {
      isAnswered = false;
      const q = currentQuestions[currentIndex];

      document.getElementById("progress-text").textContent = `${currentIndex + 1} / ${currentQuestions.length}`;
      document.getElementById("category-badge").textContent = q.category || "解剖学";
      document.getElementById("question-text").textContent = q.text;

      // 画像制御
      const imgContainer = document.getElementById("image-container");
      const imgElem = document.getElementById("question-image");
      if (q.img && q.img.trim() !== "") {
        imgElem.src = q.img;
        imgContainer.style.display = "block";
      } else {
        imgContainer.style.display = "none";
        imgElem.src = "";
      }

      // 選択肢描画
      const choicesContainer = document.getElementById("choices-container");
      choicesContainer.innerHTML = "";

      q.choices.forEach((choiceText, idx) => {
        if (!choiceText || choiceText.toString().trim() === "") return;

        const choiceNum = idx + 1;
        const btn = document.createElement("button");
        btn.className = "choice-btn";
        btn.onclick = () => selectAnswer(choiceNum);

        btn.innerHTML = `
          <span class="choice-number">${choiceNum}</span>
          <span>${choiceText}</span>
        `;
        choicesContainer.appendChild(btn);
      });

      document.getElementById("explanation-card").style.display = "none";
      document.getElementById("next-btn").style.display = "none";
    }

    // 解答判定
    function selectAnswer(selectedIndex) {
      if (isAnswered) return;
      isAnswered = true;

      const q = currentQuestions[currentIndex];
      const correctIndex = Number(q.answer);
      const buttons = document.querySelectorAll(".choice-btn");

      buttons.forEach((btn, idx) => {
        btn.disabled = true;
        const currentChoiceNum = idx + 1;

        if (currentChoiceNum === correctIndex) {
          btn.classList.add("correct");
        }
        if (currentChoiceNum === selectedIndex && selectedIndex !== correctIndex) {
          btn.classList.add("incorrect");
        }
      });

      const expCard = document.getElementById("explanation-card");
      const expTitle = document.getElementById("explanation-title");
      const expText = document.getElementById("explanation-text");

      if (selectedIndex === correctIndex) {
        score++;
        expTitle.textContent = "【正解】";
        expTitle.className = "explanation-title is-correct";
      } else {
        expTitle.textContent = `【不正解】 正解は ${correctIndex} です`;
        expTitle.className = "explanation-title is-incorrect";
      }

      expText.textContent = q.exp || "解説はありません。";
      expCard.style.display = "block";

      const nextBtn = document.getElementById("next-btn");
      if (currentIndex === currentQuestions.length - 1) {
        nextBtn.textContent = "結果を見る";
      } else {
        nextBtn.textContent = "次の問題へ";
      }
      nextBtn.style.display = "block";
    }

    function nextQuestion() {
      currentIndex++;
      if (currentIndex < currentQuestions.length) {
        showQuestion();
      } else {
        showResult();
      }
    }

    function showResult() {
      document.getElementById("quiz-view").style.display = "none";
      document.getElementById("result-view").style.display = "block";

      document.getElementById("result-score").textContent = `${score} / ${currentQuestions.length}`;

      const rate = score / currentQuestions.length;
      let comment = "";
      if (rate === 1) comment = "素晴らしい！この範囲は完璧にマスターしています！";
      else if (rate >= 0.7) comment = "あと一歩です！間違えた箇所の分岐や神経根を復習しておきましょう。";
      else comment = "繰り返し解いて確実に頭に入れていきましょう！";

      document.getElementById("result-comment").textContent = comment;
    }

    window.onload = fetchQuestions;
  </script>
</body>
</html>
